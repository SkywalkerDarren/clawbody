[project]
name = "qwen3-stt"
version = "0.1.0"
description = "Qwen3-ASR 本地语音识别服务 (流式版本)"
readme = "README.md"
authors = [
    { name = "SkywalkerDarren", email = "yh322yh@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "qwen-asr[vllm]>=0.1.0",
    "soundfile>=0.13.1",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.scripts]
qwen3-stt-server = "qwen3_stt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen3_stt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
