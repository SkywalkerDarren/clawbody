[project]
name = "wespeaker-sv"
version = "0.1.0"
description = "WeSpeaker Speaker Verification service"
readme = "README.md"
authors = [
    { name = "SkywalkerDarren", email = "yh322yh@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.20.0",
    "pyyaml>=6.0",
    "silero-vad>=5.1",
    "requests>=2.28.0",
    "onnxruntime-gpu>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[project.scripts]
wespeaker-sv-server = "sv_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sv_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
