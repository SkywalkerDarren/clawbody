# ClawBody 配置文件

# ============ 角色配置 ============
# Brain 只需调用 speak(text)，身体根据配置自动处理
persona:
  name: "Assistant"

  # 语音配置
  voice:
    provider: "qwen"           # edge, qwen
    id: "vivian"               # 声音 ID (内置或自定义)
    language: "Chinese"           # Auto, Chinese, English, Japanese, Korean

  # Live2D 模型配置
  model:
    path: "/assets/shizuku.model.json"
    scale: 0.95
    position: "bottom-center"  # bottom-center, bottom-left, bottom-right

  # 表情映射 (情绪 -> 表情ID)
  expressions:
    default: "f01"
    happy: "f02"
    surprised: "f03"
    shy: "f04"

  # 动作映射 (动作类型 -> 动作组)
  # 注意: speaking 设为空字符串，让 model.speak() 自动处理口型
  motions:
    idle: "idle"
    speaking: ""
    thinking: "idle"
    greeting: "flick_head"
    surprised: "shake"

# ============ 服务配置 ============

# gRPC 服务配置
grpc:
  port: 50051
  host: "0.0.0.0"

# HTTP/WebSocket/SSE 服务配置
http:
  port: 4000
  host: "0.0.0.0"
  # apiKey: "your-secret-key"  # 取消注释启用 API 认证

# mDNS 服务发现
discovery:
  enabled: true
  # serviceName: "clawbody-custom"  # 自定义服务名称

# ============ 能力配置 ============

capabilities:
  # Live2D 桌面伴侣
  live2d:
    enabled: true

  # TTS 语音合成
  tts:
    enabled: true
    providers:
      edge:
        type: "edge"
      qwen:
        type: "qwen"
        baseUrl: "http://localhost:8765"

  # STT 语音识别
  stt:
    enabled: true
    providers:
      qwen:
        type: "qwen"
        baseUrl: "http://localhost:8766"

  # Vision 屏幕截图
  vision:
    enabled: true
    preferredTool: "auto"  # auto, scrot, import

# ============ OpenClaw 集成 ============
# STT 转录结果自动转发给 OpenClaw AI 处理
# 复制此文件为 config/local.yaml 并填入真实配置
openclaw:
  webhookUrl: "http://localhost:18789"     # OpenClaw Gateway 地址
  sessionKey: "voice:default"              # 固定 session，保持上下文

# 日志配置
logging:
  level: "info"  # debug, info, warn, error
